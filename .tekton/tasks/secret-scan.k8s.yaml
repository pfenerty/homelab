apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: homelab-secret-scan
  namespace: homelab-ci
spec:
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - args:
        - --no-banner
        - fs
        - "."
        - --config
        - .betterleaks.toml
        - --redact
      command:
        - betterleaks
      image: ghcr.io/betterleaks/betterleaks:v2.0.0-rc.2
      name: betterleaks
  workspaces:
    - name: workspace
