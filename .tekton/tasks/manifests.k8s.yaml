apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: homelab-manifests
  namespace: homelab-ci
spec:
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - computeResources:
        limits:
          cpu: "1"
          memory: 1Gi
        requests:
          cpu: 200m
          memory: 256Mi
      image: alpine/k8s:1.37.0
      name: kustomize-build
      script: |-
        #!/bin/sh
        log() { printf '[%s] %s\n' "$(date +%H:%M:%S)" "$*"; }
        sh .tektonic/scripts/build-manifests.sh
    - computeResources:
        limits:
          cpu: "1"
          memory: 1Gi
        requests:
          cpu: 200m
          memory: 256Mi
      image: alpine/k8s:1.37.0
      name: kubeconform
      script: |-
        #!/bin/sh
        log() { printf '[%s] %s\n' "$(date +%H:%M:%S)" "$*"; }
        sh .tektonic/scripts/validate-manifests.sh
  workspaces:
    - name: workspace
