apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: homelab-talos-patches
  namespace: homelab-ci
spec:
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - image: alpine/k8s:1.37.0
      name: validate-patches
      script: |-
        #!/bin/sh
        log() { printf '[%s] %s\n' "$(date +%H:%M:%S)" "$*"; }
        sh .tektonic/scripts/validate-talos-patches.sh
  workspaces:
    - name: workspace
