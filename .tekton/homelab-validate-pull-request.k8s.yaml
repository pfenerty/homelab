apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/task: "[.tekton/tasks/git-clone.k8s.yaml, .tekton/tasks/manifests.k8s.yaml, .tekton/tasks/flux-wiring.k8s.yaml, .tekton/tasks/sops-encryption.k8s.yaml, .tekton/tasks/secret-scan.k8s.yaml, .tekton/tasks/talos-patches.k8s.yaml, .tekton/tasks/vendored-manifests.k8s.yaml]"
  name: homelab-validate-pull-request
spec:
  params:
    - name: project-name
      value: "{{ repo_name }}"
    - name: repo-full-name
      value: "{{ repo_owner }}/{{ repo_name }}"
    - name: source-branch
      value: "{{ source_branch }}"
    - name: url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
  pipelineSpec:
    params:
      - description: Repository name, bound by PAC from repo_name
        name: project-name
        type: string
      - description: Repository owner/name, bound by PAC from repo_owner and repo_name
        name: repo-full-name
        type: string
      - description: Branch or tag ref of the event, bound by PAC from source_branch
        name: source-branch
        type: string
      - name: url
        type: string
      - name: revision
        type: string
    tasks:
      - name: git-clone
        params:
          - name: url
            value: $(params.url)
          - name: revision
            value: $(params.revision)
        taskRef:
          kind: Task
          name: homelab-git-clone
        workspaces:
          - name: workspace
            workspace: workspace
      - name: manifests
        runAfter:
          - git-clone
        taskRef:
          kind: Task
          name: homelab-manifests
        timeout: 15m
        workspaces:
          - name: workspace
            workspace: workspace
      - name: flux-wiring
        runAfter:
          - git-clone
        taskRef:
          kind: Task
          name: homelab-flux-wiring
        timeout: 5m
        workspaces:
          - name: workspace
            workspace: workspace
      - name: sops-encryption
        runAfter:
          - manifests
        taskRef:
          kind: Task
          name: homelab-sops-encryption
        timeout: 5m
        workspaces:
          - name: workspace
            workspace: workspace
      - name: secret-scan
        runAfter:
          - flux-wiring
        taskRef:
          kind: Task
          name: homelab-secret-scan
        timeout: 10m
        workspaces:
          - name: workspace
            workspace: workspace
      - name: talos-patches
        runAfter:
          - sops-encryption
        taskRef:
          kind: Task
          name: homelab-talos-patches
        timeout: 15m
        workspaces:
          - name: workspace
            workspace: workspace
      - name: vendored-manifests
        runAfter:
          - secret-scan
        taskRef:
          kind: Task
          name: homelab-vendored-manifests
        timeout: 5m
        workspaces:
          - name: workspace
            workspace: workspace
    workspaces:
      - name: workspace
  taskRunTemplate:
    podTemplate:
      env:
        - name: HOME
          value: /tekton/home
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
    serviceAccountName: default
  workspaces:
    - name: workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
          storageClassName: local-path
