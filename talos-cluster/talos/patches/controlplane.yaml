# talos/patches/controlplane.yaml
#
# Talos 1.14 moved the kubelet and the control-plane component settings out of the
# v1alpha1 document into dedicated documents, and rejects a config that sets the same
# thing in both places. etcd is the one below that 1.14 still reads from v1alpha1.
cluster:
    etcd:
        extraArgs:
            # RPi4 SD card/SSD fsync latency causes leader elections at defaults (100ms/1000ms).
            # 500ms heartbeat gives the leader 500ms to respond; election-timeout is 5x per etcd docs.
            heartbeat-interval: "500"
            election-timeout: "5000"
---
# Was machine.kubelet.extraConfig.
apiVersion: v1alpha1
kind: KubeletConfig
config:
    # RPi4 nodes have only ~3.2Gi allocatable RAM shared by etcd, kube-apiserver,
    # kube-controller-manager, kube-scheduler, and required DaemonSets (Cilium, Alloy).
    # Reserve headroom so kubelet evicts workload pods before starving those.
    systemReserved:
        cpu: 250m
        memory: 384Mi
        ephemeral-storage: 1Gi
    kubeReserved:
        cpu: 250m
        memory: 384Mi
        ephemeral-storage: 1Gi
    evictionHard:
        memory.available: 200Mi
        nodefs.available: 10%
---
# Was cluster.proxy.disabled — Cilium replaces kube-proxy.
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
# Was cluster.network.cni.name: none — we install Cilium ourselves.
#
# 1.14 has no "cni: none" switch. `gen config` emits a KubeFlannelCNIConfig document,
# and the way to run without Talos's bundled CNI is to remove that document, which is
# what `$patch: delete` does. Leaving it in place alongside a Cilium install would have
# Talos deploy Flannel over the top.
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
# Was cluster.apiServer.
apiVersion: v1alpha1
kind: KubeAPIServerConfig
extraArgs:
    # Lower default (100) watch cache per resource type — apiserver on RPi4 was
    # consuming up to 1.6Gi (half the node's allocatable RAM), inflated by the
    # ~70 CRDs across Cilium/Tekton/CNPG/KEDA/Prometheus-operator/Tailscale/Flux/Gateway API.
    default-watch-cache-size: "50"
    # 2026-08: one wedged CronJob produced 66% of all cluster events (1560 of 2354
    # FailedCreate). Halving the 1h default bounds how much event write traffic a
    # misbehaving controller can push onto the SD-card-backed etcd.
    event-ttl: 30m
    # 4 nodes, ~107 pods. Shed load rather than melt down when etcd is slow and
    # requests queue up. Defaults are 400/200.
    max-requests-inflight: "200"
    max-mutating-requests-inflight: "100"
env:
    # apiserver RSS measured at 1.7-2.0Gi of the node's 3.7Gi, squeezing page cache
    # (466Mi) below the etcd DB size (204Mi) so reads that should be cached hit the
    # SD card. Cap the Go heap and collect more aggressively to give the cache room.
    # Deliberately conservative — if the apiserver GC-thrashes (CPU up, RSS pinned at
    # the limit), raise GOMEMLIMIT rather than lowering it.
    GOGC: "50"
    GOMEMLIMIT: 1400MiB
---
# Was cluster.controllerManager.
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
    # A single slow etcd read must not cost leadership. Defaults (15s/10s/2s) assume
    # datacentre latency; measured Lease GET here has multi-second outliers, which was
    # crash-looping kube-controller-manager ~1100 times over 20 days.
    leader-elect-lease-duration: 60s
    leader-elect-renew-deadline: 45s
    leader-elect-retry-period: 10s
---
# Was cluster.scheduler.
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
    leader-elect-lease-duration: 60s
    leader-elect-renew-deadline: 45s
    leader-elect-retry-period: 10s
