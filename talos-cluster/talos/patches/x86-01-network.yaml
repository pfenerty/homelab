machine:
  # binfmt_misc is provided by the siderolabs/binfmt-misc system extension baked
  # into this worker's factory image (WORKER_SCHEMATIC). Loaded at boot so qemu
  # handlers can be registered for multi-arch melange/apko builds, which are pinned
  # to this amd64 node.
  #
  # Nothing registers them today: the tonistiigi/binfmt DaemonSet that used to was
  # removed, because it registers qemu inside its own container mount namespace and
  # that does not persist host-globally on Talos. A verified TaskRun confirmed
  # qemu-aarch64 was absent kernel-wide once its init container exited. Re-enabling
  # cross-arch builds needs a registrar that enters the host init namespace; the
  # module and the extension are kept so that work has somewhere to land.
  kernel:
    modules:
      - name: binfmt_misc
  network:
    interfaces:
      - interface: enp0s31f6
        dhcp: false
        addresses:
          - 192.168.1.104/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
---
# This is the only schedulable node, so CI, ocidex-pg and the monitoring stack all
# share its 16Gi. Talos only reserves 384Mi by default; on 2026-10-21 a TaskRun grew
# past what the node had left and Talos's OOM controller fired while kubelet sat in
# D state, failing its own health checks (homelab-ctd). Reserving memory caps the
# kubepods cgroup below the node's total, so a pod that runs away is killed inside
# that cgroup and kubelet, containerd and apid keep theirs. The eviction threshold
# gives kubelet room to evict by priority before the kernel or Talos has to act.
apiVersion: v1alpha1
kind: KubeletConfig
config:
  systemReserved:
    cpu: 50m
    ephemeral-storage: 256Mi
    memory: 1Gi
    pid: "100"
  kubeReserved:
    memory: 1Gi
  evictionHard:
    memory.available: 500Mi
    nodefs.available: 10%
    imagefs.available: 15%
