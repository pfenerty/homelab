apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cilium
      sourceRef:
        kind: HelmRepository
        name: cilium
      version: 1.20.3
  releaseName: cilium
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    ipam:
      mode: kubernetes
    kubeProxyReplacement: true
    # Network policies are logged, not enforced: a would-be drop shows up as an
    # AUDIT verdict in `hubble observe --verdict AUDIT` and the packet passes.
    # Flip to false once a few days of audit output come back clean.
    policyAuditMode: true
    # The agents only read their config at startup. Without this, a values change
    # such as policyAuditMode above sits in the ConfigMap until something else
    # restarts the DaemonSet.
    rollOutCiliumPods: true
    encryption:
      enabled: true
      type: wireguard
    k8sServiceHost: localhost
    k8sServicePort: 7445
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
    operator:
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
    hubble:
      relay:
        enabled: true
      ui:
        enabled: true
      tls:
        enabled: true
        auto:
          enabled: true
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - icmp
          - http
        serviceMonitor:
          enabled: true
  targetNamespace: kube-system
  interval: 1m0s
