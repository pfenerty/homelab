apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cilium
      sourceRef:
        kind: HelmRepository
        name: cilium
      version: 1.20.4
  releaseName: cilium
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    ipam:
      mode: kubernetes
    kubeProxyReplacement: true
    # Network policies are enforced. Nine days of audit mode (2026-10-13 to 10-22,
    # homelab-eik) turned up one legitimate path, ocidex's sbom-push to the ocidex-dev
    # API, now opened; everything else that would drop was meant to. Drops raise
    # CiliumPolicyDrops (apps/monitoring-extras/prometheusrule-cilium-policy.yaml).
    # Setting this back to true is the quick way out if enforcement breaks something:
    # policies only log again, and `hubble observe --verdict AUDIT` shows what they
    # would have dropped.
    policyAuditMode: false
    # The agents only read their config at startup. Without this, a values change
    # such as policyAuditMode above sits in the ConfigMap until something else
    # restarts the DaemonSet.
    rollOutCiliumPods: true
    encryption:
      enabled: true
      type: wireguard
    k8sServiceHost: localhost
    k8sServicePort: 7445
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
    operator:
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
    hubble:
      relay:
        enabled: true
      ui:
        enabled: true
      tls:
        enabled: true
        auto:
          enabled: true
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - icmp
          - http
          # Verdicts per namespace pair, for the CiliumPolicyDrops alert
          # (apps/monitoring-extras/prometheusrule-cilium-policy.yaml). Namespaces, not pods,
          # keep the series count bounded as TaskRun pods come and go.
          - policy:labelsContext=source_namespace,destination_namespace
        serviceMonitor:
          enabled: true
  targetNamespace: kube-system
  interval: 1m0s
