# DSM API credentials for the CSI driver. The user must be in the administrators group.
# cp client-info.secret.template.yaml client-info.secret.enc.yaml
# # fill in the password, then:
# sops -e -i client-info.secret.enc.yaml
apiVersion: v1
kind: Secret
metadata:
  name: client-info-secret
  namespace: synology-csi
stringData:
  client-info.yaml: |
    clients:
      - host: 192.168.1.236
        port: 5000
        https: false
        username: k8s-csi
        password: <dsm_password>
