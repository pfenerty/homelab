apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: synology-csi
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: synology-csi
      version: 0.11.4
      sourceRef:
        kind: HelmRepository
        name: synology-csi
        namespace: flux-system
  targetNamespace: synology-csi
  values:
    fullnameOverride: synology-csi
    images:
      plugin:
        # v1.4.0 is tagged upstream but was never pushed to Docker Hub; drop this
        # override once synology/synology-csi:v1.4.0 exists.
        tag: v1.3.1
    clientInfoSecret:
      create: false
      name: client-info-secret
    # iscsi-tools is only in the x86-01 schematic, so the node plugin (and therefore
    # every pod with a synology-csi volume) is amd64-only.
    node:
      nodeSelector:
        kubernetes.io/arch: amd64
      plugin:
        # Talos: iscsiadm comes from the siderolabs/iscsi-tools extension.
        extraArgs: ["--iscsiadm-path=/usr/local/sbin/iscsiadm"]
    # The snapshotter only renders when the VolumeSnapshot CRDs exist; they don't here.
    storageClasses:
      # -> StorageClass synology-csi-iscsi: one ext4 LUN per PVC.
      iscsi:
        isDefault: true
        reclaimPolicy: Delete
        volumeBindingMode: WaitForFirstConsumer
        parameters:
          protocol: iscsi
          dsm: 192.168.1.236
          location: /volume1
          fsType: ext4
      iscsi-delete:
        disabled: true
      iscsi-retain:
        disabled: true
      nfs-delete:
        disabled: true
      nfs-retain:
        disabled: true
      smb-delete:
        disabled: true
      smb-retain:
        disabled: true
