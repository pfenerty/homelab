# Credentials of the tektonic-ci org's GitHub App, read by tektonic-ci-controller
# (PAC_CONTROLLER_SECRET). Same keys as pipelines-as-code-secret. Fill in a copy
# OUTSIDE the repo (plaintext here isn't gitignored), then encrypt from the repo root:
#
#   sops encrypt --filename-override talos-cluster/flux/apps/pipelines-as-code/tektonic-ci-secret.enc.yaml \
#     /tmp/tektonic-ci-secret.yaml > talos-cluster/flux/apps/pipelines-as-code/tektonic-ci-secret.enc.yaml
#   rm /tmp/tektonic-ci-secret.yaml
apiVersion: v1
kind: Secret
metadata:
    name: tektonic-ci-secret
    namespace: pipelines-as-code
type: Opaque
stringData:
    github-application-id: "REPLACE_WITH_APP_ID"
    github-private-key: |
        -----BEGIN RSA PRIVATE KEY-----
        REPLACE_WITH_PRIVATE_KEY_PEM_CONTENTS
        -----END RSA PRIVATE KEY-----
    webhook.secret: "REPLACE_WITH_WEBHOOK_SECRET"
