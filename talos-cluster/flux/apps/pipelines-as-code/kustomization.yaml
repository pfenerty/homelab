apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - release.yaml
    - tailscale-ingress.yaml
    - pipelines-as-code-secret.enc.yaml
    - tektonic-ci-controller.yaml
    - tektonic-ci-ingress.yaml
    - tektonic-ci-secret.enc.yaml
    - network-policy.yaml
# Check-run links (Details, PipelineRun, per-task) point at the tailnet-only Tekton
# Dashboard (apps/tekton/tailscale-ingress.yaml) instead of upstream's placeholder.
# Patched here because release.yaml and tektonic-ci-controller.yaml are generated by
# update-manifests.sh.
patches:
    - target:
          kind: ConfigMap
          name: pipelines-as-code|tektonic-ci-configmap
          namespace: pipelines-as-code
      patch: |-
          - op: replace
            path: /data/tekton-dashboard-url
            value: https://tekton-dashboard.bear-velociraptor.ts.net
