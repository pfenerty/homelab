apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: tailscale-operator
    namespace: flux-system
spec:
    interval: 30m
    chart:
        spec:
            chart: tailscale-operator
            version: "1.104.2"
            sourceRef:
                kind: HelmRepository
                name: tailscale
                namespace: flux-system
            interval: 12h
    upgrade:
        remediation:
            retries: 3
            strategy: rollback
    valuesFrom:
        - kind: Secret
          name: tailscale-credentials
          targetPath: oauth.clientId
          valuesKey: clientId
        - kind: Secret
          name: tailscale-credentials
          targetPath: oauth.clientSecret
          valuesKey: clientSecret
    values:
        # kubectl over the tailnet (homelab-deq): the operator device
        # (tailscale-operator, tag:k8s-operator) proxies the apiserver and
        # impersonates the caller's tailnet login, plus groups from the policy's
        # tailscale.com/cap/kubernetes grant (rbac.yaml binds them). Auth mode;
        # the chart grants the operator ServiceAccount `impersonate`.
        #   tailscale configure kubeconfig tailscale-operator
        apiServerProxyConfig:
            mode: "true"
    targetNamespace: tailscale-operator
    install:
        createNamespace: true
