# Default-deny ingress for keda: pods here take traffic from each other, from
# Prometheus, and from the nodes (probes) and the apiserver (admission webhooks,
# aggregated APIs). Anything else needs its own policy below.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
    name: baseline-ingress
    namespace: keda
spec:
    endpointSelector: {}
    ingress:
        - fromEndpoints:
              - {}
              - matchLabels:
                    k8s:io.kubernetes.pod.namespace: monitoring
        - fromEntities:
              - host
              - remote-node
              - kube-apiserver
