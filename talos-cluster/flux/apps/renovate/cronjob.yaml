apiVersion: batch/v1
kind: CronJob
metadata:
    name: renovate-ocidex
    namespace: renovate
spec:
    schedule: "0 0 * * *"
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 60
    jobTemplate:
        spec:
            ttlSecondsAfterFinished: 3600
            template:
                spec:
                    securityContext:
                        runAsNonRoot: true
                        seccompProfile:
                            type: RuntimeDefault
                    containers:
                        - name: renovate
                          image: renovate/renovate:44.145.1
                          env:
                              - name: LOG_LEVEL
                                value: debug
                              - name: RENOVATE_REPOSITORIES
                                value: '["pfenerty/ocidex"]'
                              # renovate.json re-synthesizes .tekton/ from .tektonic/ in postUpgradeTasks;
                              # without this allowlist Renovate refuses both commands.
                              - name: RENOVATE_ALLOWED_COMMANDS
                                value: '["^npm ci --ignore-scripts$", "^npm run synth$"]'
                          envFrom:
                              - secretRef:
                                    name: renovate-env
                          resources:
                              requests:
                                  cpu: 250m
                                  memory: 512Mi
                              limits:
                                  cpu: "2"
                                  memory: 2Gi
                          securityContext:
                              allowPrivilegeEscalation: false
                              capabilities:
                                  drop:
                                      - ALL
                    restartPolicy: Never
---
apiVersion: batch/v1
kind: CronJob
metadata:
    name: renovate-homelab
    namespace: renovate
spec:
    schedule: "0 2 * * *"
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 60
    jobTemplate:
        spec:
            ttlSecondsAfterFinished: 3600
            template:
                spec:
                    securityContext:
                        runAsNonRoot: true
                        seccompProfile:
                            type: RuntimeDefault
                    containers:
                        - name: renovate
                          image: renovate/renovate:44.145.1
                          env:
                              - name: LOG_LEVEL
                                value: debug
                              - name: RENOVATE_REPOSITORIES
                                value: '["pfenerty/homelab"]'
                              # renovate.json re-synthesizes .tekton/ from .tektonic/ and re-vendors the
                              # flux/apps manifests via update-manifests.sh in postUpgradeTasks; without
                              # this allowlist Renovate refuses those commands.
                              - name: RENOVATE_ALLOWED_COMMANDS
                                value: '["^npm ci --ignore-scripts$", "^npm run synth$", "^sh talos-cluster/flux/apps/(pipelines-as-code|tekton|tekton-chains)/update-manifests\\.sh$"]'
                          envFrom:
                              - secretRef:
                                    name: renovate-env
                          resources:
                              requests:
                                  cpu: 250m
                                  memory: 512Mi
                              limits:
                                  cpu: "2"
                                  memory: 2Gi
                          securityContext:
                              allowPrivilegeEscalation: false
                              capabilities:
                                  drop:
                                      - ALL
                    restartPolicy: Never
---
apiVersion: batch/v1
kind: CronJob
metadata:
    name: renovate-tektonic
    namespace: renovate
spec:
    schedule: "0 4 * * *"
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 60
    jobTemplate:
        spec:
            ttlSecondsAfterFinished: 3600
            template:
                spec:
                    securityContext:
                        runAsNonRoot: true
                        seccompProfile:
                            type: RuntimeDefault
                    containers:
                        - name: renovate
                          image: renovate/renovate:44.145.1
                          env:
                              - name: LOG_LEVEL
                                value: debug
                              - name: RENOVATE_REPOSITORIES
                                value: '["tektonic-ci/core", "tektonic-ci/reporter-github", "tektonic-ci/cache-gcs"]'
                              # tektonic's renovate.json re-synthesizes .tekton/ in postUpgradeTasks;
                              # without this allowlist Renovate refuses both commands.
                              - name: RENOVATE_ALLOWED_COMMANDS
                                value: '["^npm ci --ignore-scripts$", "^npm run synth$"]'
                          # Its own token: these repos are in the tektonic-ci org, which the
                          # personal fine-grained PAT in renovate-env cannot reach.
                          envFrom:
                              - secretRef:
                                    name: renovate-env-tektonic-ci
                          resources:
                              requests:
                                  cpu: 250m
                                  memory: 512Mi
                              limits:
                                  cpu: "2"
                                  memory: 2Gi
                          securityContext:
                              allowPrivilegeEscalation: false
                              capabilities:
                                  drop:
                                      - ALL
                    restartPolicy: Never
---
