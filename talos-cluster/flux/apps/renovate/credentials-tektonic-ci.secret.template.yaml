# Token for renovate-tektonic only. A fine-grained PAT has exactly one resource owner, so
# the personal one in renovate-env can't reach the tektonic-ci org. This one is owned by
# tektonic-ci with access to all its repositories:
#   read/write: Contents, Pull requests, Issues, Commit statuses, Workflows
#   read:       Metadata, Checks
#
# *.secret.yaml is the encrypted name here, so fill in a copy OUTSIDE the repo, then
# encrypt from the repo root:
#
#   sops encrypt --filename-override talos-cluster/flux/apps/renovate/credentials-tektonic-ci.secret.enc.yaml \
#     /tmp/renovate-tektonic-ci.yaml > talos-cluster/flux/apps/renovate/credentials-tektonic-ci.secret.enc.yaml
#   rm /tmp/renovate-tektonic-ci.yaml
apiVersion: v1
kind: Secret
metadata:
    name: renovate-env-tektonic-ci
    namespace: renovate
stringData:
    RENOVATE_TOKEN: <github_fine_grained_pat owned by tektonic-ci>
    RENOVATE_PLATFORM: github
