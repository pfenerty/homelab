# tsidp users carry groups from the tailnet policy grant's extraClaims; the
# apiserver prefixes them with oidc: (talos/patches/controlplane.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-homelab-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:homelab-admins
