# Default-deny ingress for headlamp: pods here take traffic from each other, from
# Prometheus, and from the nodes (probes) and the apiserver.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
    name: baseline-ingress
    namespace: headlamp
spec:
    endpointSelector: {}
    ingress:
        - fromEndpoints:
              - {}
              - matchLabels:
                    k8s:io.kubernetes.pod.namespace: monitoring
        - fromEntities:
              - host
              - remote-node
              - kube-apiserver
---
# Headlamp is published through a Tailscale Ingress; the proxy pods run in
# tailscale-operator.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
    name: tailscale-ingress
    namespace: headlamp
spec:
    endpointSelector: {}
    ingress:
        - fromEndpoints:
              - matchLabels:
                    k8s:io.kubernetes.pod.namespace: tailscale-operator
---
# Headlamp holds users' cluster-admin tokens, so it talks only to DNS, the
# apiserver and tsidp (through the operator's egress proxy), not the internet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
    name: egress
    namespace: headlamp
spec:
    endpointSelector: {}
    egress:
        - toEndpoints:
              - matchLabels:
                    k8s:io.kubernetes.pod.namespace: kube-system
                    k8s-app: kube-dns
          toPorts:
              - ports:
                    - port: "53"
                      protocol: ANY
        - toEntities:
              - kube-apiserver
        - toEndpoints:
              - matchLabels:
                    k8s:io.kubernetes.pod.namespace: tailscale-operator
                    tailscale.com/parent-resource: idp-egress
          toPorts:
              - ports:
                    - port: "443"
                      protocol: TCP
