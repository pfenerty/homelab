# Headlamp's OIDC client in tsidp. Register it in the tsidp admin UI
# (https://idp.bear-velociraptor.ts.net) with redirect URI
#   https://headlamp.bear-velociraptor.ts.net/oidc-callback
# then:
#
#   cp headlamp-oidc.secret.template.yaml headlamp-oidc.secret.enc.yaml
#   # paste the client ID and secret, then:
#   sops -e -i headlamp-oidc.secret.enc.yaml
#
# and add headlamp-oidc.secret.enc.yaml to kustomization.yaml. The client ID is
# also the apiserver's audience in talos/patches/controlplane.yaml.
apiVersion: v1
kind: Secret
metadata:
    name: headlamp-oidc
    namespace: headlamp
stringData:
    OIDC_CLIENT_ID: <tsidp_client_id>
    OIDC_CLIENT_SECRET: <tsidp_client_secret>
