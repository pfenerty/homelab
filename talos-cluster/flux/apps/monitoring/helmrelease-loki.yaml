apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      # grafana/helm-charts froze loki at 7.3.0; continues in grafana-community.
      version: "18.15.1"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
      interval: 12h
  targetNamespace: monitoring
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    # Chart 12.0 renamed SingleBinary to Monolithic (values key stays singleBinary).
    deploymentMode: Monolithic
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      limits_config:
        retention_period: 336h
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
    singleBinary:
      replicas: 1
      # synology-csi iSCSI volumes only attach on x86-01.
      nodeSelector:
        kubernetes.io/arch: amd64
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      persistence:
        enabled: true
        storageClass: synology-csi-iscsi
        size: 15Gi
    # Disable all distributed-mode components
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0
    # Chart default is required pod anti-affinity; with RollingUpdate and the
    # amd64-only node, the replacement pod can never schedule. null (not {})
    # drops the default; Helm merges maps.
    gateway:
      affinity: null
    # SingleBinary + filesystem doesn't need external memcached caches;
    # defaults (8192Mi chunks, 1024Mi results) saturate node memory requests.
    chunksCache:
      replicas: 0
    resultsCache:
      replicas: 0
