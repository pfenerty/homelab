apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: tempo
      version: "3.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
      interval: 12h
  targetNamespace: monitoring
  values:
    tempo:
      reportingEnabled: false
      retention: 168h
      # Traces arrive via the alloy-otel gateway over OTLP. (The chart's Jaeger
      # receivers stay; its service template requires them.)
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    # WAL + blocks on local disk next to Prometheus, off the RPis and off NFS.
    nodeSelector:
      kubernetes.io/arch: amd64
    persistence:
      enabled: true
      storageClassName: local-path
      size: 10Gi
