# Discord webhook for Alertmanager (Server Settings → Integrations → Webhooks).
#
#   cp alertmanager-discord.secret.template.yaml alertmanager-discord.secret.yaml
#   # paste the webhook URL, then:
#   sops -e -i alertmanager-discord.secret.yaml
#
# and add alertmanager-discord.secret.yaml to kustomization.yaml. Until then
# Alertmanager runs (the volume is optional) but Discord sends fail.
apiVersion: v1
kind: Secret
metadata:
    name: alertmanager-discord
    namespace: monitoring
stringData:
    webhook-url: <discord_webhook_url>
