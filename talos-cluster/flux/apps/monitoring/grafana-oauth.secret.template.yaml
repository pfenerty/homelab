# Grafana's OIDC client in tsidp. Register it in the tsidp admin UI
# (https://idp.bear-velociraptor.ts.net) with redirect URI
# https://grafana.bear-velociraptor.ts.net/login/generic_oauth, then:
#
#   cp grafana-oauth.secret.template.yaml grafana-oauth.secret.enc.yaml
#   # paste the client ID and secret, then:
#   sops -e -i grafana-oauth.secret.enc.yaml
#
# and add grafana-oauth.secret.enc.yaml to kustomization.yaml. Until then the
# envFromSecrets entry is optional and Grafana keeps local login only.
apiVersion: v1
kind: Secret
metadata:
    name: grafana-oauth
    namespace: monitoring
stringData:
    GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID: <tsidp_client_id>
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: <tsidp_client_secret>
