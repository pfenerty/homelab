# GitHub App "ocidex-ci-checks" (Checks: read and write only, installed on pfenerty/ocidex).
# @tektonic-ci/reporter-github's appAuth reads these in the reporter steps alone and mints a
# fresh installation token per step, so check runs still complete when a PipelineRun waits in
# the PAC concurrency queue past the hour PAC's own per-run token lasts.
apiVersion: v1
kind: Secret
metadata:
    name: github-checks-app
    namespace: ocidex-ci
type: Opaque
stringData:
    app-id: "REPLACE_WITH_APP_ID"
    private-key: |
        REPLACE_WITH_PEM
