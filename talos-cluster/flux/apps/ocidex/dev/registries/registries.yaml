---
apiVersion: ocidex.io/v1alpha1
kind: OCIRegistry
metadata:
    name: ghcr-ocidex
    namespace: ocidex-dev
spec:
    name: "GHCR — OCIDex"
    # The homelab cluster resolves running images only against registries in
    # its own OCIDex namespace, so this registry lives there: running ocidex
    # images are then attributed to it and verified with the key below
    # (ocidex-nps9.6). Takes effect once the operator moves registries on
    # update (ocidex-nps9.33); older operators ignore it for an existing row.
    namespace: ocidex
    type: ghcr
    url: ghcr.io
    visibility: public
    repositories:
        - pfenerty/ocidex-api
        - pfenerty/ocidex-web
        - pfenerty/ocidex-operator
        - pfenerty/ocidex-scanner-worker
        - pfenerty/ocidex-enrichment-worker
        - pfenerty/ocidex-oci-metadata-worker
        - pfenerty/ocidex-provenance-worker
        - pfenerty/ocidex-user-enricher-worker
        - pfenerty/ocidex-vuln-worker
        - pfenerty/ocidex-git-worker
    tagLimit: 25
    scanMode: poll
    pollIntervalMinutes: 360
    verificationMode: public_key
    trustPublicKey: |
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEOG684pJqBzPj4fdZWa6IlBpCSACr
        EWICBlOUwWqLnwONosETNam9aHcylxZBpEdnzpJ4YopLdzY8jYKy6+82jw==
        -----END PUBLIC KEY-----
---
apiVersion: ocidex.io/v1alpha1
kind: OCIRegistry
metadata:
    name: ghcr-apko-cicd
    namespace: ocidex-dev
spec:
    name: "GHCR — apko-cicd"
    type: ghcr
    url: ghcr.io
    visibility: public
    repositories:
        - pfenerty/apko-cicd/base
        - pfenerty/apko-cicd/syft
        - pfenerty/apko-cicd/grype
        - pfenerty/apko-cicd/oras
        - pfenerty/apko-cicd/apko
        - pfenerty/apko-cicd/melange
        - pfenerty/apko-cicd/golangci-lint
        - pfenerty/apko-cicd/gcloud
        - pfenerty/apko-cicd/nodejs
        - pfenerty/apko-cicd/golang
        - pfenerty/apko-cicd/jdk
        - pfenerty/apko-cicd/maven
        - pfenerty/apko-cicd/gradle
        - pfenerty/apko-cicd/rust
    tagLimit: 50
    scanMode: poll
    pollIntervalMinutes: 360
    verificationMode: public_key
    trustPublicKey: |
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEOG684pJqBzPj4fdZWa6IlBpCSACr
        EWICBlOUwWqLnwONosETNam9aHcylxZBpEdnzpJ4YopLdzY8jYKy6+82jw==
        -----END PUBLIC KEY-----
---
# The six below were created by hand through the API; the operator adopted the
# existing rows (status.registryID pre-set) so their SBOMs kept their source.
apiVersion: ocidex.io/v1alpha1
kind: OCIRegistry
metadata:
    name: quay-cilium
    namespace: ocidex-dev
spec:
    name: "Quay.io — Cilium"
    namespace: ocidex
    type: generic
    url: quay.io
    visibility: public
    repositories:
        - cilium/cilium-envoy
        - cilium/hubble-relay
        - cilium/hubble-ui
        - cilium/hubble-ui-backend
        - cilium/operator-generic
    tagPatterns:
        - semver
    tagLimit: 15
    scanMode: poll
    pollIntervalMinutes: 360
---
apiVersion: ocidex.io/v1alpha1
kind: OCIRegistry
metadata:
    name: quay-cilium-agent
    namespace: ocidex-dev
spec:
    name: "Quay.io — Cilium Agent (signed)"
    # The OCIDex namespace this registry already lives in. The operator moves a
    # registry whose spec.namespace names another existing namespace, and a
    # move never creates one, so this must match a namespace that exists.
    namespace: "Quay.io — Cilium Agent (signed)"
    type: generic
    url: quay.io
    visibility: public
    repositories:
        - cilium/cilium
    tagPatterns:
        - semver
    tagLimit: 15
    scanMode: poll
    pollIntervalMinutes: 360
    verificationMode: keyless
    trustIdentity: https://github.com/cilium/cilium/.github/workflows
    trustIssuer: https://token.actions.githubusercontent.com
---
