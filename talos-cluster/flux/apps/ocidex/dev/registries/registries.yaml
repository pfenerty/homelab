---
apiVersion: ocidex.io/v1alpha1
kind: OCIRegistry
metadata:
    name: k8s-apiserver
    namespace: ocidex-dev
spec:
    name: "registry.k8s.io — kube-apiserver (signed)"
    # The OCIDex namespace this registry already lives in. The operator moves a
    # registry whose spec.namespace names another existing namespace, and a
    # move never creates one, so this must match a namespace that exists.
    namespace: "registry.k8s.io — kube-apiserver (signed)"
    type: generic
    url: registry.k8s.io
    visibility: public
    repositories:
        - kube-apiserver
    tagPatterns:
        - semver
    tagLimit: 15
    scanMode: poll
    pollIntervalMinutes: 360
    verificationMode: keyless
    trustIdentity: krel-trust@k8s-releng-prod.iam.gserviceaccount.com
    trustIssuer: https://accounts.google.com
