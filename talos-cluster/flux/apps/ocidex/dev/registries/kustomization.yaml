apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - registries.yaml
    # Docker Hub registries need the dockerhub-auth secret. Create it from
    # dockerhub-auth.secret.template.yaml, then uncomment both lines.
    - dockerhub-auth.secret.enc.yaml
    - dockerhub.yaml
