---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: ocidex-dev
    namespace: flux-system
spec:
    interval: 5m
    releaseName: ocidex-dev
    targetNamespace: ocidex-dev
    # synology-csi iSCSI volumes only attach on x86-01; the chart has no
    # vulnWorker nodeSelector value.
    postRenderers:
        - kustomize:
              patches:
                  - target:
                        kind: Deployment
                        name: ocidex-dev-vuln-worker
                    patch: |
                        - op: add
                          path: /spec/template/spec/nodeSelector
                          value:
                              kubernetes.io/arch: amd64
    install:
        timeout: 10m
        remediation:
            retries: -1
    upgrade:
        timeout: 10m
        remediation:
            retries: -1
    chart:
        spec:
            chart: ocidex
            version: ">=0.0.0-0"
            sourceRef:
                kind: HelmRepository
                name: ocidex
                namespace: flux-system
    values:
        # No image.tag override: dev renders the chart's appVersion (sha-<sha>),
        # an immutable, reproducible tag that changes every build. Combined with the
        # monotonic chart version, each main push advances the chart -> new appVersion
        # -> Deployment rolls onto the new sha image. (Was tag=main + pullPolicy=Always,
        # which never changed the pod spec so dev never rolled.)
        existingSecret: ocidex-secrets
        nats:
            storage:
                storageClass: local-path
        gatewayApi:
            enabled: false
        keda:
            enabled: false
        monitoring:
            enabled: false
        api:
            env:
                environment: development
                # First admin, promoted at sign-in (ocidex BOOTSTRAP_ADMINS,
                # ocidex-avsz.1). Replaces the account ocidex's migration 00008
                # seeded, which 00079 demotes.
                bootstrapAdmins: "github:16961380"
                frontendUrl: "https://ocidex.app"
                githubRedirectUrl: "https://ocidex.app/auth/callback"
                corsAllowedOrigins: "https://ocidex.app"
        enricherWorkerDefaults:
            replicas: 1
        vulnWorker:
            db:
                persistence:
                    storageClass: synology-csi-iscsi
        # The chart owns ocidex's network policy (ocidex docs/DEPLOYMENT.md § Network
        # policy); this repo supplies the peers only the cluster knows. The platform's
        # bound is ../infra/egress-guardrail.yaml.
        networkPolicy:
            enabled: true
            ingress:
                from:
                    - namespaceSelector:
                          matchLabels:
                              kubernetes.io/metadata.name: cloudflare-gateway
                apiFrom:
                    - namespaceSelector:
                          matchLabels:
                              kubernetes.io/metadata.name: ocidex-operator-dev
                    - namespaceSelector:
                          matchLabels:
                              kubernetes.io/metadata.name: ocidex-k8s-agent-dev
            egress:
                database:
                    - podSelector:
                          matchLabels:
                              cnpg.io/cluster: ocidex-pg
