---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ocidex-k8s-agent-dev
  namespace: flux-system
spec:
  interval: 5m
  releaseName: ocidex-k8s-agent-dev
  targetNamespace: ocidex-k8s-agent-dev
  chart:
    spec:
      chart: ocidex-k8s-agent
      version: ">=0.0.0-0"
      sourceRef:
        kind: HelmRepository
        name: ocidex
        namespace: flux-system
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    image:
      repository: ghcr.io/pfenerty/ocidex-k8s-agent
    server:
      url: "http://ocidex-dev-api.ocidex-dev.svc.cluster.local"
    apiKey:
      secretName: ocidex-k8s-agent-dev-secrets
      secretKey: OCIDEX_API_KEY
    cluster:
      id: "cb905b74-84c6-4c4b-ba6c-f17ec024efb5"
    namespaces: []
    reportInterval: 5m
    logLevel: info
    # The chart's NetworkPolicy; the apiserver allow is ./network-policy.yaml
    # because Cilium never matches the apiserver by ipBlock.
    networkPolicy:
      enabled: true
      egress:
        server:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ocidex-dev
