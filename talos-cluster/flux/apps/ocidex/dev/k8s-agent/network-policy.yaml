# The chart's networkPolicy (./helmrelease.yaml) makes the inventory agent default-deny and
# allows DNS and the OCIDex API. It can't allow the apiserver: Cilium never matches
# the apiserver by ipBlock, only by the kube-apiserver entity.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
    name: apiserver-egress
    namespace: ocidex-k8s-agent-dev
spec:
    endpointSelector: {}
    egress:
        - toEntities:
              - kube-apiserver
