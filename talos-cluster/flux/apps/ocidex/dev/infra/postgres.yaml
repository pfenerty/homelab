---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
    name: ocidex-pg
    namespace: ocidex-dev
spec:
    imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
    instances: 1
    # Local SSD on x86-01. On synology-csi iSCSI the 44 GB component table
    # saturated the LUN (125 ms reads, 100% util) and the API timed out, so
    # the NAS's redundancy isn't worth it here. local-path doesn't enforce
    # size, and CNPG refuses to shrink the claim below the existing 150Gi.
    storage:
        size: 150Gi
        storageClass: local-path
    # x86-01 is the only amd64 node and has the SSD.
    affinity:
        nodeSelector:
            kubernetes.io/arch: amd64
    # A 1-core limit throttled PG in ~half its CFS periods and 160 MB of
    # shared_buffers sent nearly every read of the 44 GB component table to
    # disk. x86-01 has the headroom, so no CPU limit. Keep the CPU request
    # small: unlimited, PG still bursts onto idle cores, and a 1-core request
    # left too little schedulable CPU for the CI pods that share x86-01.
    resources:
        requests:
            cpu: "250m"
            memory: "4Gi"
        limits:
            memory: "6Gi"
    postgresql:
        parameters:
            wal_compression: "on"
            random_page_cost: "1.1"
            shared_buffers: "1536MB"
            effective_cache_size: "4GB"
            work_mem: "32MB"
            # Query observability for ocidex's DB tuning (homelab-kfr,
            # ocidex-kf1p.1). Setting these makes CNPG add both libraries to
            # shared_preload_libraries, so changing them restarts PG.
            pg_stat_statements.max: "5000"
            pg_stat_statements.track: "top"
            auto_explain.log_min_duration: "2s"
            auto_explain.log_analyze: "on"
            auto_explain.log_buffers: "on"
            auto_explain.log_timing: "off"
            auto_explain.log_nested_statements: "off"
    bootstrap:
        initdb:
            database: ocidex
            owner: ocidex
            secret:
                name: ocidex-pg-app
