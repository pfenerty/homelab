---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
    name: ocidex-pg
    namespace: ocidex-dev
spec:
    imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
    instances: 2
    storage:
        size: 150Gi
        storageClass: synology-csi-iscsi
    # synology-csi's node plugin and iscsi-tools only run on x86-01.
    affinity:
        nodeSelector:
            kubernetes.io/arch: amd64
    resources:
        requests:
            cpu: "250m"
            memory: "512Mi"
        limits:
            cpu: "1000m"
            memory: "2Gi"
    postgresql:
        parameters:
            wal_compression: "on"
            random_page_cost: "1.1"
    bootstrap:
        initdb:
            database: ocidex
            owner: ocidex
            secret:
                name: ocidex-pg-app
