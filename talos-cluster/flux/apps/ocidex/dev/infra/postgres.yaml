---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
    name: ocidex-pg
    namespace: ocidex-dev
spec:
    imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
    instances: 2
    # Local SSD on x86-01. On synology-csi iSCSI the 44 GB component table
    # saturated the LUN (125 ms reads, 100% util) and the API timed out, so
    # the NAS's redundancy isn't worth it here. local-path doesn't enforce
    # size; this is an honest estimate.
    storage:
        size: 100Gi
        storageClass: local-path
    # x86-01 is the only amd64 node and has the SSD.
    affinity:
        nodeSelector:
            kubernetes.io/arch: amd64
    resources:
        requests:
            cpu: "250m"
            memory: "512Mi"
        limits:
            cpu: "1000m"
            memory: "2Gi"
    postgresql:
        parameters:
            wal_compression: "on"
            random_page_cost: "1.1"
    bootstrap:
        initdb:
            database: ocidex
            owner: ocidex
            secret:
                name: ocidex-pg-app
