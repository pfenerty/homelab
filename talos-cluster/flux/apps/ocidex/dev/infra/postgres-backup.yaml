---
# Nightly logical backup of ocidex-pg. There is no object store or CSI
# snapshotter in the cluster, so CNPG's native backups have nowhere to go;
# a pg_dump onto its own synology-csi LUN keeps a copy apart from the data
# volume. Restore: pg_restore -j 4 -d ocidex /dumps/<stamp>.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: ocidex-pg-dumps
    namespace: ocidex-dev
spec:
    accessModes:
        - ReadWriteOnce
    storageClassName: synology-csi-iscsi
    resources:
        requests:
            # One -Fd -Z 3 dump is ~10 GB; room for KEEP=3 plus the one in flight.
            storage: 60Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
    name: ocidex-pg-dump
    namespace: ocidex-dev
spec:
    # Suspended: the first mkfs of the thick-provisioned dump LUN discards the
    # whole volume, saturates the NAS, and took the ocidex-pg data LUN down
    # with it (2026-10-13). Re-enable once synology-csi LUNs are thin.
    suspend: true
    schedule: "0 3 * * *"
    timeZone: America/Los_Angeles
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    jobTemplate:
        spec:
            backoffLimit: 1
            activeDeadlineSeconds: 7200
            template:
                spec:
                    restartPolicy: Never
                    # synology-csi's node plugin and iscsi-tools only run on x86-01.
                    nodeSelector:
                        kubernetes.io/arch: amd64
                    securityContext:
                        runAsNonRoot: true
                        runAsUser: 26
                        runAsGroup: 26
                        fsGroup: 26
                        seccompProfile:
                            type: RuntimeDefault
                    containers:
                        - name: pg-dump
                          # Same image as the Cluster, so pg_dump matches the server major.
                          image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
                          securityContext:
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities:
                                  drop:
                                      - ALL
                          env:
                              - name: KEEP
                                value: "3"
                              - name: PGHOST
                                value: ocidex-pg-rw
                              - name: PGDATABASE
                                value: ocidex
                              - name: PGUSER
                                valueFrom:
                                    secretKeyRef:
                                        name: ocidex-pg-app
                                        key: username
                              - name: PGPASSWORD
                                valueFrom:
                                    secretKeyRef:
                                        name: ocidex-pg-app
                                        key: password
                          command:
                              - bash
                              - -euo
                              - pipefail
                              - -c
                              - |
                                stamp=$(date -u +%Y%m%dT%H%M%SZ)
                                rm -rf /dumps/*.partial
                                pg_dump -Fd -j 4 -Z 3 -f "/dumps/$stamp.partial"
                                # A dump whose TOC can't be read is not a backup.
                                pg_restore -l "/dumps/$stamp.partial" > /dev/null
                                mv "/dumps/$stamp.partial" "/dumps/$stamp"
                                ls -1d /dumps/*Z | sort | head -n -"$KEEP" | xargs -r rm -rf
                                du -sh /dumps/*Z
                          resources:
                              requests:
                                  cpu: 500m
                                  memory: 512Mi
                              limits:
                                  memory: 2Gi
                          volumeMounts:
                              - name: dumps
                                mountPath: /dumps
                              - name: tmp
                                mountPath: /tmp
                    volumes:
                        - name: dumps
                          persistentVolumeClaim:
                              claimName: ocidex-pg-dumps
                        - name: tmp
                          emptyDir: {}
