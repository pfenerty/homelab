# The ocidex chart's networkPolicy (../main/helmrelease.yaml) covers every pod it
# deploys. What it can't cover is the database, which lives here (CNPG instance and
# job pods), so its policies do too. The platform bound for the whole namespace is
# egress-guardrail.yaml.
#
# Postgres takes connections from this namespace only, plus the CNPG operator
# (status on 8000, and 5432) and Prometheus (9187). The tunnel reaches the app,
# not the database behind it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
    name: postgres-ingress
    namespace: ocidex-dev
spec:
    endpointSelector:
        matchLabels:
            cnpg.io/cluster: ocidex-pg
    ingress:
        - fromEndpoints:
              - {}
          toPorts:
              - ports:
                    - port: "5432"
                      protocol: TCP
        - fromEndpoints:
              - matchLabels:
                    k8s:io.kubernetes.pod.namespace: cnpg-system
          toPorts:
              - ports:
                    - port: "5432"
                      protocol: TCP
                    - port: "8000"
                      protocol: TCP
        - fromEndpoints:
              - matchLabels:
                    k8s:io.kubernetes.pod.namespace: monitoring
          toPorts:
              - ports:
                    - port: "9187"
                      protocol: TCP
---
# CNPG's instance manager talks to the apiserver; instances replicate to each other.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
    name: postgres-egress
    namespace: ocidex-dev
spec:
    endpointSelector:
        matchLabels:
            cnpg.io/cluster: ocidex-pg
    egress:
        - toEndpoints:
              - matchLabels:
                    cnpg.io/cluster: ocidex-pg
        - toEndpoints:
              - matchLabels:
                    k8s:io.kubernetes.pod.namespace: kube-system
                    k8s-app: kube-dns
          toPorts:
              - ports:
                    - port: "53"
                      protocol: ANY
        - toEntities:
              - kube-apiserver
