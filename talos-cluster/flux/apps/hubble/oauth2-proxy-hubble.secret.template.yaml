# oauth2-proxy's OIDC client in tsidp. Register it in the tsidp admin UI
# (https://idp.bear-velociraptor.ts.net) with redirect URI
#   https://hubble.bear-velociraptor.ts.net/oauth2/callback
# and generate a cookie secret:
#   openssl rand -base64 32 | tr -- '+/' '-_'
# then:
#
#   cp oauth2-proxy-hubble.secret.template.yaml oauth2-proxy-hubble.secret.enc.yaml
#   # paste the three values, then:
#   sops -e -i oauth2-proxy-hubble.secret.enc.yaml
#
# and add oauth2-proxy-hubble.secret.enc.yaml to kustomization.yaml. The proxy
# won't start without it, and the Ingress points at the proxy.
apiVersion: v1
kind: Secret
metadata:
    name: oauth2-proxy-hubble
    namespace: kube-system
stringData:
    OAUTH2_PROXY_CLIENT_ID: <tsidp_client_id>
    OAUTH2_PROXY_CLIENT_SECRET: <tsidp_client_secret>
    OAUTH2_PROXY_COOKIE_SECRET: <cookie_secret>
