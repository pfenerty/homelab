apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
    name: tektonic
    namespace: tektonic-ci
spec:
    url: https://github.com/tektonic-ci/core
    # Queue runs past 2 as Pending; see ocidex-ci/pac-repository.yaml (homelab-3p8).
    concurrency_limit: 2
---
