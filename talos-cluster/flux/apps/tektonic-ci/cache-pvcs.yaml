# Caches for the tektonic-ci repos' self-CI. tektonic emits each `claimName:
# <project>-cache` reference; the claims themselves live here.
#
# tektonic-ci/core: npm node_modules and the grype DB.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: tektonic-cache
    namespace: tektonic-ci
spec:
    accessModes:
        - ReadWriteOnce
    storageClassName: local-path
    resources:
        requests:
            storage: 5Gi
---
# tektonic-ci/reporter-github: npm node_modules.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: reporter-github-cache
    namespace: tektonic-ci
spec:
    accessModes:
        - ReadWriteOnce
    storageClassName: local-path
    resources:
        requests:
            storage: 2Gi
---
# tektonic-ci/cache-gcs: npm node_modules.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: cache-gcs-cache
    namespace: tektonic-ci
spec:
    accessModes:
        - ReadWriteOnce
    storageClassName: local-path
    resources:
        requests:
            storage: 2Gi
