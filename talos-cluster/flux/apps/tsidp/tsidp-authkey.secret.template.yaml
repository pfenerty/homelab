# Tailscale auth key for tsidp's first login (afterwards the node key lives on
# the PVC). Either a tagged, non-ephemeral, pre-approved auth key for tag:tsidp,
# or the operator's OAuth client secret (apps/tailscale/credentials.secret.yaml,
# clientSecret) with options appended, once tag:tsidp lists tag:k8s-operator in
# tagOwners:
#
#   tskey-client-...?ephemeral=false&preauthorized=true
#
#   cp tsidp-authkey.secret.template.yaml tsidp-authkey.secret.enc.yaml
#   # paste the key, then:
#   sops -e -i tsidp-authkey.secret.enc.yaml
#
# and add tsidp-authkey.secret.enc.yaml to kustomization.yaml. Until then the
# pod runs (the volume is optional) and logs a login URL instead.
apiVersion: v1
kind: Secret
metadata:
    name: tsidp-authkey
    namespace: tsidp
stringData:
    authkey: <tailscale_auth_key>
