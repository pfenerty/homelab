# TREK's OIDC client in tsidp. Register it in the tsidp admin UI
# (https://idp.bear-velociraptor.ts.net) with redirect URI
#   https://trek.bear-velociraptor.ts.net/api/auth/oidc/callback
# then:
#
#   cp trek-oidc.secret.template.yaml trek-oidc.secret.enc.yaml
#   # paste the client ID and secret, then:
#   sops -e -i trek-oidc.secret.enc.yaml
#
# and add trek-oidc.secret.enc.yaml to kustomization.yaml. It lives in
# flux-system because the HelmRelease reads it through valuesFrom.
apiVersion: v1
kind: Secret
metadata:
    name: trek-oidc
    namespace: flux-system
stringData:
    clientId: <tsidp_client_id>
    clientSecret: <tsidp_client_secret>
