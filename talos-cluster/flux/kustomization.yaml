  # DISABLED: the binfmt_misc module is loaded on the worker (schematic + kernel
  # module, done), but the tonistiigi/binfmt DaemonSet registers qemu in its own
  # container mount-namespace instance, which does NOT persist host-globally on
  # Talos (Talos does not host-mount binfmt_misc like systemd distros do). A
  # verified TaskRun confirmed qemu-aarch64 is absent kernel-wide after the init
  # container exits, so cross-arch (arm64) melange builds still fail. Needs a
  # host-init-namespace registrar (e.g. nsenter into PID 1 + qemu-user-static)
  # before enabling. See bd issue.
  # - binfmt.kustomization.yaml
  # - zot.kustomization.yaml
  - ocidex-dev-infra.kustomization.yaml
  - ocidex-dev-main.kustomization.yaml
  - ocidex-dev-operator.kustomization.yaml
  # SCAFFOLD: enable once the cluster is registered in OCIDex and the key is sealed.
  # Both are missing on purpose — cluster.id in the HelmRelease is empty, and
  # apps/ocidex/dev/k8s-agent/ has no secrets.enc.yaml, so reconciling this now would
  # fail the kustomize build. To turn it on:
  #   1. POST /api/v1/clusters (or the UI) and paste the returned UUID into
  #      apps/ocidex/dev/k8s-agent/helmrelease.yaml under values.cluster.id
  #   2. cp apps/ocidex/dev/k8s-agent/secrets.template.yaml \
  #         apps/ocidex/dev/k8s-agent/secrets.enc.yaml, fill in a read-write API key
  #      owned by the namespace owner, then `sops -e -i` it
  #   3. uncomment the line below
  # - ocidex-dev-k8s-agent.kustomization.yaml
  - ocidex-dev-registries.kustomization.yaml
  - dev-spaces.kustomization.yaml
  - monitoring.kustomization.yaml
  - monitoring-extras.kustomization.yaml
  - trek.kustomization.yaml
