apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ocidex-dev-k8s-agent
  namespace: flux-system
spec:
  dependsOn:
    - name: ocidex-dev-main
  interval: 5m0s
  path: ./talos-cluster/flux/apps/ocidex/dev/k8s-agent
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
