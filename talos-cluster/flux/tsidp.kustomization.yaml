apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tsidp
  namespace: flux-system
spec:
  # The egress Services need the operator; the PVC needs synology-csi.
  dependsOn:
    - name: tailscale
    - name: synology-csi
  interval: 10m0s
  path: ./talos-cluster/flux/apps/tsidp
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: tsidp
      namespace: tsidp
