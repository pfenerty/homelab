apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synology-csi
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./talos-cluster/flux/apps/synology-csi
  prune: true
  sourceRef:
