apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trek
  namespace: flux-system
spec:
  dependsOn:
    - name: synology-csi
  interval: 10m0s
  path: ./talos-cluster/flux/apps/trek
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
