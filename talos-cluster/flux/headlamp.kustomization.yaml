apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headlamp
  namespace: flux-system
spec:
  # Login needs tsidp and its egress proxy.
  dependsOn:
    - name: tailscale
    - name: tsidp
  interval: 10m0s
  path: ./talos-cluster/flux/apps/headlamp
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: headlamp
      namespace: flux-system
